name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steward -d steward"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration tests (apps/api) use the service containers directly
      # instead of spinning up Testcontainers inside the runner.
      STEWARD_TEST_DATABASE_URL: postgres://steward:steward@localhost:5432/steward
      STEWARD_TEST_REDIS_URL: redis://localhost:6379/7
      # Playwright E2E boots the real API + worker + node daemon against its
      # own database (created automatically) and Redis logical DB.
      STEWARD_E2E_DATABASE_URL: postgres://steward:steward@localhost:5432/steward_e2e
      STEWARD_E2E_REDIS_URL: redis://localhost:6379/8

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Integration tests
        run: pnpm test:integration

      - name: Install Playwright browser
        run: pnpm --filter @steward/web exec playwright install chromium --with-deps

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
