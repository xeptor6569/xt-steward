# Steward XT — self-hosted control plane.
#
# Quickstart (serves http://localhost via Caddy):
#   cp .env.example .env      # set POSTGRES_PASSWORD at minimum
#   docker compose up -d --build
#
# Production: set STEWARD_DOMAIN (e.g. app.stewardxt.cc) and
# STEWARD_COOKIE_SECURE=true in .env; Caddy provisions TLS automatically.
#
# Steward nodes are NOT part of this stack — they run on the machines you
# want agents to execute on. See docs/deployment.md.

name: steward-xt

x-backend-env: &backend-env
  NODE_ENV: production
  STEWARD_DATABASE_URL: postgres://steward:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/steward
  STEWARD_REDIS_URL: redis://redis:6379
  STEWARD_LOG_LEVEL: ${STEWARD_LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: steward
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steward -d steward"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies SQL migrations, then exits. api/worker wait for it.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/migrate.js"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      STEWARD_API_HOST: 0.0.0.0
      STEWARD_API_PORT: "3001"
      # The exact browser origin of the dashboard (scheme + host).
      STEWARD_WEB_ORIGIN: ${STEWARD_WEB_ORIGIN:-http://localhost}
      # Behind Caddy; needed so rate limiting sees real client IPs.
      STEWARD_TRUST_PROXY: "true"
      # Set to true when serving over HTTPS (STEWARD_DOMAIN configured).
      STEWARD_COOKIE_SECURE: ${STEWARD_COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Server-side (Next.js) requests go container-to-container.
      STEWARD_API_INTERNAL_URL: http://api:3001
    depends_on:
      - api

  # Single public entrypoint: /api/* (including the node WebSocket gateway)
  # goes to the API, everything else to the dashboard.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STEWARD_DOMAIN: ${STEWARD_DOMAIN:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
